name: crown-watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: crown-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout scripts (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Snapshot public competition state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 main/.github/scripts/crown_watch.py data
      - name: Raise an issue for level alerts (the owner is notified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data/alerts_new.json ]; then
            title="LEVEL WATCH: $(python3 -c "import json;a=json.load(open('data/alerts_new.json'));print(a[0]['text'][:150] + (' (+%d more)' % (len(a)-1) if len(a) > 1 else ''))")"
            body="$(python3 -c "import json;print('The level watch saw:\n\n' + '\n'.join('- ' + x['text'] for x in json.load(open('data/alerts_new.json'))))")"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" || true
            rm -f data/alerts_new.json
          fi
      - name: Commit if anything changed
        working-directory: data
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "crown-watch[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crown.json crown-history.json
            git commit -m "crown-watch $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin data
            done
          fi
